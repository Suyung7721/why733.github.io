title: "味纪"
subtitle: "记录每一道用心做的菜"
description: "新加坡美食爱好者 | 家常菜教程 · 餐厅评测 · 烹饪日记"
url: "https://why733.github.io"
baseurl: ""
repository: "why733/why733.github.io"
locale: "zh-CN"
minimal_mistakes_skin: "sunrise"     # 推荐温暖橙色系，可换成 "mint" 或 "default"

# Logo 和头像（先用占位，之后你可以换成自己的）
logo: "/assets/images/logo.png"
avatar: "/assets/images/avatar.jpg"

# 头部大图（推荐放一张高分辨率美食图）
header:
  image: "/assets/images/header-food.jpg"
  overlay_color: "#2c2c2c"
  overlay_filter: 0.3

# 搜索和日期
search: true
show_date: true
read_time: true

# 作者信息
author:
  name: "Lei"
  bio: "新加坡吃货 · 喜欢把每一道菜都认真记录下来"
  avatar: "/assets/images/avatar.jpg"
  location: "Singapore"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/why733"

# 导航栏
navigation:
  - title: 首页
    url: /
  - title: 所有文章
    url: /posts/
  - title: 教程
    url: /categories/教程/
  - title: 评测
    url: /categories/评测/
  - title: 关于我
    url: /about/

# 默认文章设置
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      show_date: true
      read_time: true
      comments: true
      share: true
      related: true
      header:
        teaser: true
